name = "channel-plan"

# The verifier rebuilds the planner from the collected sources and checks the survey against its
# hashes. Top-level: nested under [verifier] the value is silently dropped.
artifacts = ["/app/planner/src/", "/app/survey/"]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Software"
subcategory = "Algorithms"
tags = ["cpp", "frequency-assignment", "combinatorial-optimization", "radio-planning", "exact-search"]
languages = ["cpp"]
difficulty = "core"
expert_time_estimate_hours = 4
difficulty_explanation = """
Channel planning for a radio network strung along a railway is a minimum-interference frequency assignment, NP-hard in general, and on this survey the ordinary tools for it stall well short of the best plan. The objective is fully stated: every radio takes one of six channels, radios on one mast sit two channels apart because they share a combiner, some stretches bar a channel, and the plan pays each surveyed pair's co-channel or adjacent-channel penalty. The difficulty is reaching the optimum of that objective, not understanding it. Greedy assignment along the line lands 30.3% above the lowest total on the shipped survey, steepest descent over whole-mast moves 23.9%, two minutes of random restarts 18.7%, and simulated annealing over whole-mast channel sets, the standard general-purpose search for this problem, still 3.1% above after ten minutes and 3.2% to 4.1% after the 45 seconds a graded run allows. Across eight fresh surveys of the same shape the ten-minute anneal never came closer than 1.5%, and on the seven-channel second survey it sits 4.4% to 6.9% out. The bar is 0.75%, the midpoint between that best anneal and the optimum. What an expert sees is that the problem is not a general graph: the survey only logs pairs out to 18 km, so once the masts are taken in order along the line only a handful of them can still interact with anything ahead, and an exact search over their channel sets is possible. Seeing that is half of it. A dynamic programme over single radios with that window has 6^10 states on the shipped survey and 7^11 on the second, which does not fit in a minute; it becomes small only when each mast is treated as one variable whose options are the legal channel sets the combiner rule and the barred channels leave, and a mast leaves the state as soon as it has no pair further along. Then the shipped survey peaks at 82,944 states and the second at 3.24 million, and both solve exactly in seconds. The survey is synthetic, from solution/gen_survey.py: masts at random spacings, one to three radios each, pairs listed with a probability that falls with distance and a co-channel penalty that falls with its square, which is how a drive-test interference matrix behaves; synthetic data is what lets the grader hold the exact optimum. The person who does this job is the radio planning engineer for a rail operator's train radio network, working a licence change or a new stretch of line.
"""
solution_explanation = """
solution/planner.cpp reads the survey, orders the masts by km and lists, for each mast, every legal channel set: one channel per radio, none barred, radios on the mast two apart. It groups the listed pairs by the two masts they join and records, for every mast, the furthest mast it has a pair with. It then runs a dynamic programme along the line. The state after mast k is the choice made at every earlier mast that still has a pair beyond k, packed as a mixed-radix index; adding mast k+1 adds, for each state and each of its channel sets, the penalty against the masts in the state it has pairs with, and then drops any mast with nothing further ahead. Each step keeps the predecessor and the choice for every new state, and the plan is read back from the single final state. It is exact, so the plan it writes reaches the lowest penalty, 4042 on the shipped survey in 0.07 s and 2589 on the second in 4.1 s, well inside the 60-second limit. The same code was checked against exhaustive search on ten small surveys and agreed on all ten, and no annealing run in the calibration ever beat it. solve.sh installs the file over the stub and builds it with the project's Makefile.
"""
verification_explanation = """
Grading happens in a separate container, which keeps only the regular files directly in /app/planner/src, compiles them as an unprivileged user with g++ -O2 -std=c++17 and a small object linked first that stops the program from starting other processes or running code it did not compile, then seals the binary to root. It runs the binary from /app/planner on the shipped survey and then on a second survey staged only after the build, from a fresh root-owned directory, each run under a hard 60-second kill with the box's interpreters and shell tools closed to the build user. Plans are moved to root-only paths only if they are regular files, and pytest reads them with O_NOFOLLOW. Nine checks run, each stated in instruction.md: the five survey files are unchanged by sha256; on each survey the run finished inside 60 seconds; the plan has the radio,channel header and exactly one row per radio; the plan is legal (channel in the licence, not barred for that radio, radios on one mast two apart); and the total penalty, recomputed from pairs.csv with integers, satisfies total * 10000 <= optimum * 10075. The two optima are stored root-only in the image; they were computed by the reference and are exact. The second survey has 420 masts, 723 radios, 7 channels, other spacing, reach and penalty scale and four barred stretches, so a plan or a table carried in the source cannot pass it and a state space that fits the shipped survey by luck has to fit a larger one. Six arms were run through this verifier besides the oracle (1) and the empty stub (0), each scoring 0 on its own check: the reference without the adjacent-channel penalty fails the bar at 78.2% and 162.6% above; one that writes a mast's first channel to all its radios fails legality on the mast rule; one that ignores barred channels fails legality on barred channels; one that writes the exact plan and then spins fails only the 60-second check; annealing over whole-mast sets for 45 seconds fails the bar at 3.2% to 4.1% and 5.6% to 9.6% over three runs; and the shipped plan pasted into the source passes the shipped survey and fails the second.
"""
relevant_experience = """
I author tasks in this edition, several of them accepted, and this one came out of a specific lesson from the last rounds: a rule stated plainly gets implemented correctly, so difficulty that survives full disclosure has to sit in reaching an answer rather than in knowing what the answer is. Combinatorial optimization is where that is true in practice, and minimum-interference channel assignment is a problem I know from the frequency-assignment literature, where annealing and tabu search are the standard tools and exact methods over the network's structure are the less travelled route. I measured every baseline here on eight fresh surveys per configuration before setting the bar, cross-checked the exact planner against exhaustive search, and put the bar at the midpoint between the best baseline and the optimum.
"""

[verifier]
# one build (capped at 900 s by test.sh) and two runs of at most 60 s each
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
# offline: the planner needs nothing fetched
network_mode = "no-network"

[environment]
# must be public on every task: the image build and the harness install happen in this phase
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 8192
storage_mb = 10240
